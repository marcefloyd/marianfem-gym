<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientas - Marian Fem</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Crea tu cuenta</h1>
            <p class="text-sm text-zinc-400">Regístrate para reservar tus clases en Marian Fem Training</p>
        </div>

        <!-- Formulario de Registro -->
        <form id="register-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Correo electrónico</label>
                <input type="email" id="email" required 
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-600 transition"
                    placeholder="tu_correo@email.com">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-600 transition"
                    placeholder="••••••••">
            </div>

            <!-- Mensaje de Error o Éxito -->
            <div id="mensaje" class="hidden p-3 rounded-xl text-xs font-medium text-center"></div>

            <button type="submit" 
                class="w-full bg-pink-600 hover:bg-pink-500 text-white py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-pink-600/20">
                Registrarse
            </button>
        </form>

        <!-- Enlace para volver al Login -->
        <div class="text-center mt-6">
            <p class="text-xs text-zinc-500">¿Ya tienes una cuenta? 
                <a href="admin-login.html" class="text-pink-500 hover:underline font-semibold">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <!-- Lógica de Supabase para el Registro -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://ciorlilsipudyqhuzxzh.supabase.co'
        const SUPABASE_ANON_KEY = 'sb_publishable_VFhlc6La51QGJT-_qVu19Q_6hqlXWof'

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        const form = document.getElementById('register-form')
        const mensaje = document.getElementById('mensaje')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value.trim()

            mensaje.classList.add('hidden')

            // Llamada a Supabase para registrar un nuevo usuario
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            })

            if (error) {
                mensaje.textContent = "Error al registrarse: " + error.message;
                mensaje.className = "p-3 rounded-xl text-xs font-medium text-center bg-pink-500/10 text-pink-400 border border-pink-500/20";
                mensaje.classList.remove('hidden');
            } else {
                mensaje.textContent = "¡Registro exitoso! Ya puedes iniciar sesión.";
                mensaje.className = "p-3 rounded-xl text-xs font-medium text-center bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                mensaje.classList.remove('hidden');
                
                // Opcional: Redirigir al login después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'admin-login.html';
                }, 2000);
            }
        })
    </script>
</body>
</html>
