<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - MARIAN FEM Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-8 space-y-6 shadow-xl">
        <div class="text-center space-y-2">
            <div class="inline-block bg-pink-600 text-white font-black px-3.5 py-2 rounded-2xl text-xl tracking-wider mb-2">MF</div>
            <h1 class="text-2xl font-black text-white">Iniciar Sesión</h1>
            <p class="text-xs text-zinc-400">Ingresa tus credenciales de acceso exclusivo</p>
        </div>

        <!-- Formulario de Login -->
        <form id="login-form" class="space-y-4">
            <div class="space-y-1 text-left">
                <label class="text-xs font-semibold text-zinc-300">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="admin@marianfem.com" class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white focus:outline-none focus:border-pink-500 transition">
            </div>

            <div class="space-y-1 text-left">
                <label class="text-xs font-semibold text-zinc-300">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white focus:outline-none focus:border-pink-500 transition">
            </div>

            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-pink-600/20">
                Iniciar Sesión
            </button>
        </form>

        <div id="error-msg" class="text-xs text-red-400 text-center hidden"></div>
        
        <div class="text-center pt-2">
            <a href="../index/index.html" class="text-xs text-zinc-500 hover:text-zinc-300 transition">← Volver al sitio público</a>
        </div>
    </div>

    <!-- Script de Autenticación con Supabase -->
    <script type="module" src="admin-login.js"></script>
</body>
</html>
